[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smbr"
version = "0.1.0"
description = "Small Model, Big Results — a local-first TUI coding-agent harness that keeps small models honest with enforced gates"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "SMBR contributors" }]
keywords = ["ai", "agent", "coding-agent", "tui", "harness", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
# Core dependencies only. Model backends and MCP servers are optional extras so
# the kernel and gates stay usable (and testable) without a model server.
dependencies = [
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.7,<3",
    "rich>=15.0",
    "textual>=8.2,<9",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-python>=0.25,<0.26",
]

[project.optional-dependencies]
ollama = ["ollama>=0.6,<0.7"]
dev = ["pytest>=9.1,<10", "ruff>=0.17,<0.18"]

[project.scripts]
smbr = "smbr.cli:main"

[project.urls]
Homepage = "https://github.com/<owner>/smbr"
Documentation = "https://github.com/<owner>/smbr/tree/main/docs"
Changelog = "https://github.com/<owner>/smbr/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.17,<0.18"]

[tool.hatch.build.targets.wheel]
packages = ["src/smbr"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["smbr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
